# NETWORK
bind 0.0.0.0
# menentukan alamat IP yang digunakan Redis untuk menerima koneksi.
# 0.0.0.0 artinya Redis listen pada semua network interface
# yang tersedia di dalam container.
# Karena Redis berjalan di Docker, akses dari host tetap masuk
# melalui port yang dipublish oleh Docker.
port 6379
# menentukan port yang digunakan Redis untuk menerima koneksi.
# 6379 adalah port default Redis.

# DOCKER LOGGING
daemonize no
# membuat Redis berjalan di foreground, bukan sebagai background process.
# Ini cocok untuk Docker karena Docker dapat memantau proses utama
# Redis secara langsung.

logfile ""
# menentukan file tempat Redis menyimpan log.
# "" berarti log tidak ditulis ke file, sehingga log dikirim
# ke standard output dan dapat dilihat menggunakan:
# docker logs learn-redis

loglevel notice
# menentukan tingkat detail log Redis.
# notice = menampilkan informasi penting seperti startup,
# shutdown, warning, dan informasi penting lainnya.


# RDB (REDIS DATABASE)

# RDB adalah metode persistence Redis dengan membuat snapshot
# dari seluruh dataset Redis secara berkala lalu menyimpannya
# ke file dump.rdb di disk.
#
# Kelebihan:
# - proses restore relatif cepat
# - ukuran file biasanya lebih kecil
# - cocok untuk backup/snapshot
#
# Kekurangan:
# - perubahan yang terjadi setelah snapshot terakhir
#   berpotensi hilang jika Redis mati sebelum snapshot berikutnya.

save 3600 1
# membuat snapshot jika minimal 1 perubahan terjadi
# dalam periode 3600 detik (1 jam).

save 300 100
# membuat snapshot jika minimal 100 perubahan terjadi
# dalam periode 300 detik (5 menit).

save 60 10000
# membuat snapshot jika minimal 10.000 perubahan terjadi
# dalam periode 60 detik (1 menit).
#
# Redis akan membuat snapshot jika salah satu kondisi save
# tersebut terpenuhi.


# AOF (APPEND ONLY FILE)

# AOF adalah metode persistence yang mencatat operasi write
# yang mengubah data Redis ke dalam file appendonly.
#


appendonly yes
# mengaktifkan AOF persistence.
# Redis akan mencatat operasi write ke AOF sehingga perubahan
# data dapat dipulihkan setelah Redis restart.

appendfsync everysec
# menentukan kapan data AOF disinkronkan ke disk.
# everysec berarti Redis melakukan fsync kira-kira setiap 1 detik.
#


# MEMORY MANAGEMENT

maxmemory 256mb
# membatasi penggunaan memory Redis sampai 256 MB.
# Ketika memory sudah mencapai batas ini, Redis akan menerapkan
# eviction policy yang ditentukan oleh maxmemory-policy.

maxmemory-policy allkeys-lru
# menentukan aturan eviction ketika Redis membutuhkan memory
# tambahan tetapi sudah mencapai batas maxmemory.
#
# allkeys:
# Redis dapat memilih key apa pun untuk dihapus,
# baik key yang mempunyai TTL maupun tidak.
#
# lru (Least Recently Used):
# Redis akan memprioritaskan key yang sudah paling lama
# tidak digunakan untuk dihapus.


# JENIS EVICTION

# volatile:
# hanya key yang memiliki TTL/expiration yang dapat dipilih
# untuk dihapus.
#
# allkeys:
# semua key dapat dipilih untuk dihapus.

# ALGORITMA EVICTION

# LRU (Least Recently Used):
# memprioritaskan key yang paling lama tidak digunakan.



# LFU (Least Frequently Used):
# memprioritaskan key yang paling jarang digunakan
# berdasarkan frekuensi aksesnya.


# LRM (Least Recently Modified):
# berarti memilih data yang paling lama terakhir dimodifikasi.

# PROTECTED MODE

protected-mode yes
# mengaktifkan protected mode.
#
# Protected mode merupakan lapisan perlindungan tambahan
# untuk mencegah Redis yang tidak dikonfigurasi dengan benar
# menerima koneksi berbahaya dari network.
#


# USER MANAGEMENT / ACL

# ACL = Access Control List.
# ACL digunakan untuk menentukan:
# - user yang boleh login
# - password user
# - key apa yang boleh diakses
# - channel Pub/Sub apa yang boleh diakses
# - command apa yang boleh dijalankan


user default off
# menonaktifkan user default Redis.
# Artinya client tidak dapat menggunakan user default
# untuk melakukan operasi sebelum melakukan authentication
# dengan user yang aktif.

# SUPERUSER

user superedis on >superb321 ~:* &:* +@all
# membuat user bernama "superedis".
#
# on
# mengaktifkan user sehingga user dapat melakukan authentication.
#
# >superb321
# menetapkan password user.
# Tanda ">" digunakan untuk menambahkan password plaintext
# ke konfigurasi ACL; Redis menyimpan password tersebut
# dalam bentuk hash di internal ACL.
#
# ~:*
# user hanya dapat mengakses key yang cocok dengan pattern ":*".
#
# &:*
# user hanya dapat mengakses channel Pub/Sub
# yang cocok dengan pattern ":*".

# +@all
# memberikan seluruh command category yang tersedia
# kepada user.

user moonchaser on >chasingmoon321 resetchannels ~moonchaser:* +@string +@write +ping +del
# membuat user bernama "moonchaser".
#
# on
# mengaktifkan user.
#
# >chasingmoon321
# menetapkan password user.
# Redis akan menyimpan password tersebut dalam bentuk
# hash pada ACL.
#
# resetchannels
# menghapus permission channel Pub/Sub yang sebelumnya
# mungkin dimiliki user.
#
# Karena setelah resetchannels tidak diberikan pattern
# channel "&...", user ini tidak mempunyai akses channel Pub/Sub.
#
# ~moonchaser:*
# membatasi akses key hanya ke key yang namanya diawali:
#
# moonchaser:
# +@write
# memberikan command yang termasuk dalam kategori WRITE,
# yaitu command yang dapat mengubah data.
#
# +ping
# memberikan permission khusus untuk menjalankan command PING.
#
# +del
# memberikan permission khusus untuk menjalankan command DEL.


